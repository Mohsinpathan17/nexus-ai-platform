services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    ports: ["8000:8000"]
    env_file:
      - ./apps/api/.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      NEXUS_DEMO_MODE: "true"
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DATABASE_URL: "postgresql+psycopg://nexus:nexus@db:5432/nexus"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "nexus-dev-secret-change-me"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    environment:
      VITE_API_URL: "http://localhost:8000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
